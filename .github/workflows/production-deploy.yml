name: Production Deploy

on:
  push:
    branches:
      - main

env:
  COMPOSE_PROJECT_NAME: pulse-ips

jobs:
  quality:
    name: Quality check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.15.0"
          cache: "yarn"

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: yarn lint

      - name: Tests
        run: yarn test

      - name: Build
        run: yarn build
        env:
          SKIP_ENV_VALIDATION: true

  build-push:
    name: Build & push to ECR
    runs-on: ubuntu-latest
    needs: [quality]
    timeout-minutes: 30
    outputs:
      image-tag: ${{ steps.tag.outputs.value }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate image tag
        id: tag
        run: echo "value=$(date -u +'%Y.%m.%d.%H%M')" >> $GITHUB_OUTPUT

      - name: Extract public build args
        id: build-args
        run: |
          ENVS='${{ vars.PRD_ENVS }}'
          echo "app_url=$(echo "$ENVS" | grep -E '^NEXT_PUBLIC_APP_URL=' | head -1 | cut -d= -f2- | tr -d '"')" >> $GITHUB_OUTPUT
          echo "app_version=$(echo "$ENVS" | grep -E '^NEXT_PUBLIC_APP_VERSION=' | head -1 | cut -d= -f2- | tr -d '"')" >> $GITHUB_OUTPUT
          echo "whatsapp=$(echo "$ENVS" | grep -E '^NEXT_PUBLIC_CONSULTANT_WHATSAPP=' | head -1 | cut -d= -f2- | tr -d '"')" >> $GITHUB_OUTPUT

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push app image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: runner
          push: true
          build-args: |
            NEXT_PUBLIC_APP_URL=${{ steps.build-args.outputs.app_url }}
            NEXT_PUBLIC_APP_VERSION=${{ steps.build-args.outputs.app_version }}
            NEXT_PUBLIC_CONSULTANT_WHATSAPP=${{ steps.build-args.outputs.whatsapp }}
          tags: |
            ${{ vars.ECR_REGISTRY }}/${{ vars.ECR_APP_REPO }}:latest
            ${{ vars.ECR_REGISTRY }}/${{ vars.ECR_APP_REPO }}:${{ steps.tag.outputs.value }}
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=app

      - name: Build and push worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: worker
          push: true
          tags: |
            ${{ vars.ECR_REGISTRY }}/${{ vars.ECR_WORKER_REPO }}:latest
            ${{ vars.ECR_REGISTRY }}/${{ vars.ECR_WORKER_REPO }}:${{ steps.tag.outputs.value }}
          cache-from: type=gha,scope=worker
          cache-to: type=gha,mode=max,scope=worker

  infra:
    name: Infrastructure check
    runs-on: production
    needs: [quality]
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Write .env
        run: printf '%s' '${{ vars.PRD_ENVS }}' > .env

      - name: Ensure db is healthy
        run: |
          if docker ps --filter "name=^pulse_db$" --filter "status=running" --format "{{.Names}}" | grep -q "^pulse_db$"; then
            echo "✔ pulse_db already running"
          elif docker ps -a --filter "name=^pulse_db$" --format "{{.Names}}" | grep -q "^pulse_db$"; then
            echo "▶ pulse_db stopped, starting..."
            docker start pulse_db
          else
            echo "▶ pulse_db not found, creating..."
            docker compose up -d --no-build db
          fi
          for i in $(seq 1 30); do
            STATUS=$(docker inspect --format='{{.State.Health.Status}}' pulse_db 2>/dev/null || echo "starting")
            if [ "${STATUS}" = "healthy" ]; then echo "✔ db healthy"; exit 0; fi
            if [ "$i" -eq 30 ]; then
              echo "✖ db failed to become healthy" >&2
              docker logs pulse_db --tail 50 >&2
              exit 1
            fi
            sleep 3
          done

      - name: Ensure redis is healthy
        run: |
          if docker ps --filter "name=^pulse_redis$" --filter "status=running" --format "{{.Names}}" | grep -q "^pulse_redis$"; then
            echo "✔ pulse_redis already running"
          elif docker ps -a --filter "name=^pulse_redis$" --format "{{.Names}}" | grep -q "^pulse_redis$"; then
            echo "▶ pulse_redis stopped, starting..."
            docker start pulse_redis
          else
            echo "▶ pulse_redis not found, creating..."
            docker compose up -d --no-build redis
          fi
          for i in $(seq 1 30); do
            STATUS=$(docker inspect --format='{{.State.Health.Status}}' pulse_redis 2>/dev/null || echo "starting")
            if [ "${STATUS}" = "healthy" ]; then echo "✔ redis healthy"; exit 0; fi
            if [ "$i" -eq 30 ]; then
              echo "✖ redis failed to become healthy" >&2
              docker logs pulse_redis --tail 50 >&2
              exit 1
            fi
            sleep 3
          done

  migrate:
    name: Database migrations
    runs-on: production
    timeout-minutes: 10
    needs: [infra, build-push]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Write .env
        run: printf '%s' '${{ vars.PRD_ENVS }}' > .env

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Pull and retag app image
        run: |
          docker pull ${{ vars.ECR_REGISTRY }}/${{ vars.ECR_APP_REPO }}:${{ needs.build-push.outputs.image-tag }}
          docker tag ${{ vars.ECR_REGISTRY }}/${{ vars.ECR_APP_REPO }}:${{ needs.build-push.outputs.image-tag }} pulse-app:latest

      - name: Run Prisma migrate deploy
        run: |
          docker run --rm \
            --network host \
            --env-file .env \
            -e DATABASE_URL=postgresql://pulse:pulse@localhost:5432/pulse \
            pulse-app:latest \
            node node_modules/prisma/build/index.js migrate deploy

  deploy:
    name: Deploy app and worker
    runs-on: production
    timeout-minutes: 10
    needs: [migrate, build-push]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Write .env
        run: printf '%s' '${{ vars.PRD_ENVS }}' > .env

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Pull and retag images
        run: |
          docker pull ${{ vars.ECR_REGISTRY }}/${{ vars.ECR_APP_REPO }}:${{ needs.build-push.outputs.image-tag }}
          docker pull ${{ vars.ECR_REGISTRY }}/${{ vars.ECR_WORKER_REPO }}:${{ needs.build-push.outputs.image-tag }}
          docker tag ${{ vars.ECR_REGISTRY }}/${{ vars.ECR_APP_REPO }}:${{ needs.build-push.outputs.image-tag }} pulse-app:latest
          docker tag ${{ vars.ECR_REGISTRY }}/${{ vars.ECR_WORKER_REPO }}:${{ needs.build-push.outputs.image-tag }} pulse-worker:latest

      - name: Recreate app, worker and schedule-register
        run: |
          for container in pulse_app pulse_worker pulse_schedule_register; do
            if docker ps -a --filter "name=^${container}$" --format "{{.Names}}" | grep -q "^${container}$"; then
              echo "▶ Removendo ${container}..."
              docker rm -f "${container}"
            fi
          done
          docker compose up -d --no-build --no-deps app worker schedule-register

  healthcheck:
    name: App health check
    runs-on: production
    timeout-minutes: 10
    needs: [deploy]
    steps:
      - name: Wait for app to become healthy
        run: |
          echo "Aguardando app ficar healthy..."
          for i in $(seq 1 20); do
            STATUS=$(docker inspect --format='{{.State.Health.Status}}' pulse_app 2>/dev/null || echo "starting")
            echo "  tentativa $i — status: ${STATUS}"
            if [ "${STATUS}" = "healthy" ]; then
              echo "✔ App healthy"
              exit 0
            fi
            if [ "${STATUS}" = "unhealthy" ]; then
              echo "✖ App unhealthy — logs:" >&2
              docker logs pulse_app --tail 100 >&2
              exit 1
            fi
            sleep 10
          done
          echo "✖ Timeout — app não ficou healthy a tempo" >&2
          docker logs pulse_app --tail 100 >&2
          exit 1
