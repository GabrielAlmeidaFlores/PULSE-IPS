name: PR Quality Check

on:
  pull_request:
    branches:
      - main
      - develop

jobs:
  ci:
    name: PR Quality Check
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.15.0"
          cache: "yarn"

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: "Lint — ESLint (0 erros, 0 warnings)"
        run: yarn lint

      - name: "Type check — tsc --noEmit (0 erros)"
        run: npx tsc --noEmit

      - name: "Tests — Vitest (todos os testes devem passar)"
        run: yarn test

      - name: "Build — Next.js production build"
        run: yarn build
        env:
          SKIP_ENV_VALIDATION: true
