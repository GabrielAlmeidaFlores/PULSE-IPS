services:
  db:
    image: postgres:16-alpine
    container_name: pulse_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: pulse
      POSTGRES_PASSWORD: pulse
      POSTGRES_DB: pulse
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulse -d pulse"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: pulse_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    container_name: pulse_migrate
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: "postgresql://pulse:pulse@db:5432/pulse"
    command: ["node", "node_modules/prisma/build/index.js", "migrate", "deploy"]

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    container_name: pulse_app
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      DATABASE_URL: "postgresql://pulse:pulse@db:5432/pulse"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    command: ["node", "server.js"]

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: worker
    container_name: pulse_worker
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: "postgresql://pulse:pulse@db:5432/pulse"
      REDIS_HOST: redis
      REDIS_PORT: "6379"

  schedule-register:
    build:
      context: .
      dockerfile: Dockerfile
      target: worker
    container_name: pulse_schedule_register
    restart: "no"
    depends_on:
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    command: ["node_modules/.bin/tsx", "--tsconfig", "tsconfig.json", "src/workers/register-schedules.ts"]

volumes:
  postgres_data:
  redis_data:
