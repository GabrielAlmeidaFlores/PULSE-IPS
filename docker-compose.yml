services:
  db:
    image: postgres:16-alpine
    container_name: pulse_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pulse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pulse}
      POSTGRES_DB: pulse
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pulse} -d pulse"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: pulse_redis
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    command: >
      sh -c "[ -n \"$$REDIS_PASSWORD\" ] && exec redis-server --requirepass \"$$REDIS_PASSWORD\" || exec redis-server"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          '[ -n "$REDIS_PASSWORD" ] && redis-cli -a "$REDIS_PASSWORD" --no-auth-warning ping || redis-cli ping',
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    image: pulse-app:latest
    container_name: pulse_migrate
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-pulse}:${POSTGRES_PASSWORD:-pulse}@db:5432/pulse"
    command: ["node", "node_modules/prisma/build/index.js", "migrate", "deploy"]

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
        NEXT_PUBLIC_CONSULTANT_WHATSAPP: ${NEXT_PUBLIC_CONSULTANT_WHATSAPP:-5511999999999}
    image: pulse-app:latest
    container_name: pulse_app
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"
    env_file:
      - .env
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-pulse}:${POSTGRES_PASSWORD:-pulse}@db:5432/pulse"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    command: ["node", "server.js"]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'node -e "require(''http'').get(''http://localhost:3000/api/health'', r => process.exit(r.statusCode === 200 ? 0 : 1)).on(''error'', () => process.exit(1))"',
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: worker
    image: pulse-worker:latest
    container_name: pulse_worker
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-pulse}:${POSTGRES_PASSWORD:-pulse}@db:5432/pulse"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          '[ -n "$REDIS_PASSWORD" ] && redis-cli -h redis -a "$REDIS_PASSWORD" --no-auth-warning ping || redis-cli -h redis ping',
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  schedule-register:
    image: pulse-worker:latest
    container_name: pulse_schedule_register
    restart: "no"
    depends_on:
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-pulse}:${POSTGRES_PASSWORD:-pulse}@db:5432/pulse"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    command: ["node", "dist/workers/register-schedules.js"]

  minio:
    image: minio/minio:latest
    container_name: pulse_minio
    restart: unless-stopped
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:latest
    container_name: pulse_minio_init
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin} &&
        mc mb --ignore-existing local/pulse &&
        mc anonymous set none local/pulse
      "

volumes:
  postgres_data:
  redis_data:
  minio_data:
